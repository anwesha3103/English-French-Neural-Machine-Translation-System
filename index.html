<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EN → FR Translator</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --navy: #0d1b2a;
            --ink: #1a2a3a;
            --gold: #c9a84c;
            --gold-light: #e8c97a;
            --cream: #f5f0e8;
            --cream-dark: #ede7d9;
            --text: #2c3e50;
            --muted: #7f8c8d;
            --white: #ffffff;
            --radius: 16px;
            --shadow: 0 20px 60px rgba(13,27,42,0.15);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--navy);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 60px;
            position: relative;
            overflow-x: hidden;
        }

        /* Decorative background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(201,168,76,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(201,168,76,0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Floating letters background */
        .bg-letters {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .bg-letters span {
            position: absolute;
            font-family: 'Playfair Display', serif;
            color: rgba(201,168,76,0.04);
            font-size: clamp(60px, 10vw, 120px);
            font-weight: 700;
            user-select: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 860px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeDown 0.8s ease both;
        }

        .lang-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(201,168,76,0.12);
            border: 1px solid rgba(201,168,76,0.25);
            border-radius: 999px;
            padding: 6px 18px;
            margin-bottom: 20px;
        }
        .lang-badge span {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: var(--gold);
            text-transform: uppercase;
        }
        .lang-badge .dot {
            width: 6px; height: 6px;
            background: var(--gold);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(36px, 6vw, 64px);
            font-weight: 700;
            color: var(--cream);
            line-height: 1.1;
            margin-bottom: 14px;
            letter-spacing: -0.02em;
        }
        h1 em {
            font-style: italic;
            color: var(--gold);
        }

        .subtitle {
            font-size: 15px;
            color: rgba(245,240,232,0.5);
            font-weight: 300;
            letter-spacing: 0.03em;
        }

        /* Main card */
        .card {
            background: var(--cream);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow), 0 0 0 1px rgba(201,168,76,0.1);
            animation: fadeUp 0.8s ease 0.2s both;
        }

        /* Translation panels */
        .panels {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 0;
            align-items: start;
            margin-bottom: 28px;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .panel-label .flag {
            font-size: 16px;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            background: var(--white);
            border: 2px solid var(--cream-dark);
            border-radius: var(--radius);
            padding: 18px;
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: var(--text);
            resize: vertical;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(201,168,76,0.12);
        }
        textarea[readonly] {
            background: #fafaf7;
            color: var(--ink);
            cursor: default;
        }
        textarea::placeholder { color: #bbb; }

        /* Divider arrow */
        .divider {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            padding-top: 30px;
            gap: 6px;
        }
        .arrow-icon {
            width: 40px; height: 40px;
            background: var(--navy);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--gold);
            font-size: 18px;
            flex-shrink: 0;
        }

        /* Submit button */
        .btn-row {
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
        }

        button[type="submit"] {
            background: var(--navy);
            color: var(--cream);
            border: none;
            border-radius: 999px;
            padding: 16px 48px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        button[type="submit"]:hover {
            background: var(--ink);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(13,27,42,0.25);
        }
        button[type="submit"]:active { transform: translateY(0); }

        button[type="submit"]::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(201,168,76,0.15), transparent);
        }

        /* Error */
        .error {
            background: #fff0f0;
            border: 1px solid #ffcdd2;
            border-radius: 10px;
            padding: 12px 16px;
            color: #c0392b;
            font-size: 14px;
            margin-top: 16px;
        }

        /* Footer stats */
        .stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 32px;
            animation: fadeUp 0.8s ease 0.4s both;
        }
        .stat {
            text-align: center;
        }
        .stat-num {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--gold);
        }
        .stat-label {
            font-size: 11px;
            color: rgba(245,240,232,0.4);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 2px;
        }

        /* Animations */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.5; transform: scale(0.8); }
        }

        /* Responsive */
        @media (max-width: 620px) {
            .card { padding: 24px 20px; }
            .panels { grid-template-columns: 1fr; }
            .divider { padding: 12px 0; flex-direction: row; }
            .arrow-icon { transform: rotate(90deg); }
            .stats { gap: 20px; }
        }
    </style>
</head>
<body>

<div class="bg-letters">
    <span style="top:5%;left:3%">A</span>
    <span style="top:15%;right:5%">Z</span>
    <span style="top:45%;left:1%">E</span>
    <span style="bottom:20%;right:2%">B</span>
    <span style="bottom:5%;left:8%">M</span>
    <span style="top:70%;right:8%">F</span>
</div>

<div class="container">

    <header>
        <div class="lang-badge">
            <span>🇬🇧 English</span>
            <div class="dot"></div>
            <span>🇫🇷 Français</span>
        </div>
        <h1>Translate with <em>Intelligence</em></h1>
        <p class="subtitle">GRU-based Neural Machine Translation · Trained on 130k+ sentence pairs</p>
    </header>

    <div class="card">
        <form method="POST" action="/">
            <div class="panels">
                <div class="panel">
                    <div class="panel-label">
                        <span class="flag">🇬🇧</span>
                        <span>English Input</span>
                    </div>
                    <textarea
                        name="text"
                        rows="7"
                        placeholder="Type your English sentence here..."
                        autofocus
                    >{{ request.form.get('text', '') }}</textarea>
                </div>

                <div class="divider">
                    <div class="arrow-icon">→</div>
                </div>

                <div class="panel">
                    <div class="panel-label">
                        <span class="flag">🇫🇷</span>
                        <span>French Output</span>
                    </div>
                    <textarea
                        rows="7"
                        readonly
                        placeholder="Translation will appear here..."
                    >{{ translated_text if translated_text else '' }}</textarea>
                </div>
            </div>

            <div class="btn-row">
                <button type="submit">Translate →</button>
            </div>

            {% if error %}
            <div class="error">⚠️ {{ error }}</div>
            {% endif %}
        </form>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-num">GRU</div>
            <div class="stat-label">Architecture</div>
        </div>
        <div class="stat">
            <div class="stat-num">256</div>
            <div class="stat-label">Hidden Units</div>
        </div>
        <div class="stat">
            <div class="stat-num">~137k</div>
            <div class="stat-label">Training Pairs</div>
        </div>
        <div class="stat">
            <div class="stat-num">Keras</div>
            <div class="stat-label">Framework</div>
        </div>
    </div>

</div>
</body>
</html>
